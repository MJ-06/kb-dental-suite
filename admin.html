<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Clinic overview - admin</title>
<style>
:root{
  --bg:#f5f5f0; --card:#fff; --ink:#1a1a1a; --muted:#666; --line:#e5e5e0; --soft:#f0f6fb;
  --blue:#0078B4; --blue-ink:#00608f; --red:#C0392B; --green:#0f7b4d;
  --bar-in:#0078B4; --bar-out:#C0392B;
  --display:ui-serif,Georgia,"Times New Roman",serif; --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14171a;--card:#1d2226;--ink:#eceff1;--muted:#a0a9b0;--line:#313a40;--soft:#1a2a35;--blue:#4db3e6;--blue-ink:#7cc8f0;--red:#ef7b6e;--green:#52c48f;--bar-in:#4db3e6;--bar-out:#ef7b6e}
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
a{color:var(--blue-ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:8px 0 16px}
.brand{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--body);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.who{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.btn{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--blue)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-ink)}
.btn[disabled]{opacity:.55;cursor:wait}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.bar label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
select,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.grow{flex:1}
nav.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
nav.tabs button{font:inherit;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected=true]{color:var(--blue-ink);border-bottom-color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.neg{color:var(--red)} .pos{color:var(--green)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--blue-ink);margin-bottom:10px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.rank{list-style:none}
.rank li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}
.rank li:last-child{border:0}
.rank .t{height:5px;border-radius:3px;background:var(--soft);grid-column:1/-1;overflow:hidden}
.rank .t b{display:block;height:100%;background:var(--blue)}
.rank.out .t b{background:var(--red)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.list{display:grid;grid-template-columns:260px 1fr;gap:16px}
@media(max-width:820px){.list{grid-template-columns:1fr}}
.menu h3{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.menu h3:first-child{margin-top:0}
.menu button{display:block;width:100%;text-align:left;font:inherit;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink)}
.menu button:hover{background:var(--soft)}
.menu button[aria-current=true]{background:var(--soft);color:var(--blue-ink);font-weight:700}
.about{color:var(--muted);font-size:13.5px;margin:2px 0 10px;max-width:70ch}
.tablewrap{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;background:var(--soft);position:sticky;bottom:0}
.msg{padding:12px 14px;border-radius:10px;margin-bottom:12px;font-size:14px}
.msg.err{background:#fff0f0;border:1px solid var(--red);color:#8a2218}
.msg.warn{background:#fff8e6;border:1px solid #d9a21b;color:#6b4b00}
@media (prefers-color-scheme:dark){.msg.err{background:#3a1d1a;color:#ffb4aa}.msg.warn{background:#352c14;color:#f1d28a}}
.empty{color:var(--muted);padding:28px 8px;text-align:center}
.signin{max-width:380px;margin:8vh auto}
.signin .f{margin-bottom:12px}.signin label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px}
.signin input{width:100%}
.hide{display:none!important}
.rowact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
@media (prefers-reduced-motion:no-preference){.kpi,.card{transition:border-color .15s}}
.kpi:hover,.card:hover{border-color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small id="clinicLine">Admin</small>Clinic overview</div>
    <div class="who hide" id="who"><span id="whoName"></span><a class="btn" href="/">Back to the app</a><button class="btn" id="signOut" type="button">Sign out</button></div>
  </header>

  <main id="signin" class="signin card hide">
    <h2>Sign in</h2>
    <p class="about" style="margin-bottom:12px">This page is for the clinic admin only.</p>
    <div class="msg err hide" id="signinErr" role="alert"></div>
    <form id="signinForm">
      <div class="f"><label for="sClinic">Clinic code</label><input id="sClinic" autocomplete="organization" required></div>
      <div class="f"><label for="sUser">Username</label><input id="sUser" autocomplete="username" required></div>
      <div class="f"><label for="sPass">Password</label><input id="sPass" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" style="width:100%" type="submit" id="signinBtn">Sign in</button>
    </form>
  </main>

  <main id="app" class="hide">
    <div class="msg err hide" id="forbidden" role="alert">Your role does not have access to this page. Only the admin can see the clinic overview.</div>
    <div id="content">
      <div class="bar" role="group" aria-label="Period">
        <div><label for="fy">Financial year</label><select id="fy"></select></div>
        <div><label for="from">From</label><input type="date" id="from"></div>
        <div><label for="to">To</label><input type="date" id="to"></div>
        <button class="btn" id="apply" type="button">Show</button>
        <span class="grow"></span>
        <a class="btn primary" id="dlAll" href="#">Download everything (Excel)</a>
      </div>
      <nav class="tabs" role="tablist">
        <button role="tab" id="tabDash" aria-selected="true" type="button">Dashboard</button>
        <button role="tab" id="tabReports" aria-selected="false" type="button">Reports</button>
      </nav>
      <div id="err" class="msg err hide" role="alert"></div>
      <section id="dash" aria-live="polite"></section>
      <section id="reports" class="hide">
        <div class="list">
          <div class="menu card" id="menu"></div>
          <div class="card" id="view"><div class="empty">Choose a report on the left.</div></div>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";
  var API = "/api/v1/admin";
  var $ = function (id) { return document.getElementById(id); };
  var state = { tab: "dash", report: null, catalog: null };

  // ── helpers (data is only ever put in with textContent) ──
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) { if (k === "class") el.className = attrs[k]; else if (k === "text") el.textContent = attrs[k]; else el.setAttribute(k, attrs[k]); }
    for (var i = 2; i < arguments.length; i++) { var c = arguments[i]; if (c == null) continue; el.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
    return el;
  }
  var inr0 = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
  var inr2 = new Intl.NumberFormat("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var money0 = function (n) { return (n < 0 ? "-" : "") + "₹" + inr0.format(Math.abs(n)); };
  function short(n) { var a = Math.abs(n); return a >= 1e7 ? (n / 1e7).toFixed(1) + "Cr" : a >= 1e5 ? (n / 1e5).toFixed(1) + "L" : a >= 1e3 ? (n / 1e3).toFixed(0) + "k" : String(Math.round(n)); }
  function show(el, on) { el.classList.toggle("hide", !on); }
  function fail(msg) { var e = $("err"); e.textContent = msg; show(e, !!msg); }

  function api(path) {
    return fetch(API + path, { credentials: "same-origin", headers: { accept: "application/json" } }).then(function (r) {
      if (r.status === 401) { showSignin(); throw new Error("signed out"); }
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 403) { show($("content"), false); show($("forbidden"), true); throw new Error("forbidden"); }
        if (!r.ok) throw new Error((j && j.message) || (j && j.error && j.error.message) || ("Something went wrong (" + r.status + ")"));
        return j;
      });
    });
  }

  function periodQuery() {
    var from = $("from").value, to = $("to").value;
    if (from || to) { var q = []; if (from) q.push("from=" + from); if (to) q.push("to=" + to); return q.join("&"); }
    return "fy=" + encodeURIComponent($("fy").value);
  }

  // ── sign in ──
  function showSignin() { show($("app"), false); show($("who"), false); show($("signin"), true); $("sClinic").focus(); }
  $("signinForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("signinBtn"); btn.disabled = true; show($("signinErr"), false);
    fetch("/api/v1/auth/login", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" },
      body: JSON.stringify({ clinic: $("sClinic").value.trim(), username: $("sUser").value.trim(), password: $("sPass").value }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) {
        btn.disabled = false;
        if (!x.ok) { var m = $("signinErr"); m.textContent = (x.j && (x.j.message || (x.j.error && x.j.error.message))) || "Could not sign in"; show(m, true); return; }
        $("sPass").value = ""; show($("signin"), false); start();
      }).catch(function () { btn.disabled = false; var m = $("signinErr"); m.textContent = "Could not reach the server"; show(m, true); });
  });
  $("signOut").addEventListener("click", function () {
    fetch("/api/v1/auth/logout", { method: "POST", credentials: "same-origin" }).then(showSignin);
  });

  // ── dashboard ──
  function kpi(label, value, sub, cls) {
    return h("div", { class: "kpi" }, h("div", { class: "l", text: label }), h("div", { class: "v " + (cls || ""), text: value }), sub ? h("div", { class: "s", text: sub }) : null);
  }
  function rank(items, key, label, out) {
    var max = Math.max.apply(null, items.map(function (i) { return Math.abs(i[key]); }).concat([1]));
    if (!items.length) return h("div", { class: "empty", text: "Nothing in this period." });
    var ul = h("ul", { class: "rank" + (out ? " out" : "") });
    items.forEach(function (i) {
      var bar = h("b"); bar.style.width = Math.max(2, Math.abs(i[key]) / max * 100) + "%";
      ul.appendChild(h("li", null, h("span", { text: i[label] }), h("span", { class: "num", text: money0(i[key]) }), h("span", { class: "t" }, bar)));
    });
    return ul;
  }
  function chart(months) {
    var W = 720, H = 260, L = 44, B = 28, T = 10, R = 6;
    var max = Math.max.apply(null, months.map(function (m) { return Math.max(m.collected, m.expenses); }).concat([1]));
    var step = Math.pow(10, Math.floor(Math.log10(max))); var top = Math.ceil(max / step) * step;
    var ns = "http://www.w3.org/2000/svg";
    function s(tag, a, txt) { var e = document.createElementNS(ns, tag); for (var k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; return e; }
    var svg = s("svg", { viewBox: "0 0 " + W + " " + H, class: "chart", role: "img", "aria-label": "Collected and spent each month" });
    var y = function (v) { return T + (H - T - B) * (1 - v / top); };
    for (var i = 0; i <= 4; i++) { var v = top * i / 4; svg.appendChild(s("line", { class: "grid", x1: L, x2: W - R, y1: y(v), y2: y(v) })); svg.appendChild(s("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }, short(v))); }
    var bw = (W - L - R) / months.length;
    months.forEach(function (m, idx) {
      var x = L + idx * bw, w = Math.min(bw * 0.36, 22);
      var g = s("g", {});
      g.appendChild(s("title", {}, m.month + ": collected " + money0(m.collected) + ", spent " + money0(m.expenses)));
      g.appendChild(s("rect", { x: x + bw / 2 - w - 1, y: y(m.collected), width: w, height: Math.max(0, y(0) - y(m.collected)), rx: 2, fill: "var(--bar-in)" }));
      g.appendChild(s("rect", { x: x + bw / 2 + 1, y: y(m.expenses), width: w, height: Math.max(0, y(0) - y(m.expenses)), rx: 2, fill: "var(--bar-out)" }));
      if (months.length <= 14 || idx % 2 === 0) g.appendChild(s("text", { x: x + bw / 2, y: H - 8, "text-anchor": "middle" }, m.month.slice(0, 3) + (months.length > 12 ? " " + m.month.slice(-2) : "")));
      svg.appendChild(g);
    });
    return svg;
  }
  function renderDash(d) {
    var k = d.kpis, root = $("dash"); root.textContent = "";
    var net = k.netPeriod;
    root.appendChild(h("div", { class: "kpis" },
      kpi("Collected " + d.period.label, money0(k.collectedPeriod), "Today " + money0(k.collectedToday) + " · this month " + money0(k.collectedMonth)),
      kpi("Spent " + d.period.label, money0(k.expensesPeriod), "This month " + money0(k.expensesMonth)),
      kpi("Net " + d.period.label, money0(net), "Collected minus all expenses", net < 0 ? "neg" : "pos"),
      kpi("Patients", inr0.format(k.patientsTotal), inr0.format(k.patientsNew) + " registered in this period"),
      kpi("Appointments this month", inr0.format(k.appointmentsMonth), inr0.format(k.appointmentsToday) + " today · " + inr0.format(k.noShowsMonth) + " no-shows"),
      kpi("Outstanding", money0(k.outstandingTotal), inr0.format(k.outstandingPatients) + " patients owe a balance", k.outstandingTotal > 0 ? "neg" : "")
    ));
    var c = h("div", { class: "card" }, h("h2", { text: "Collected and spent, by month" }),
      h("div", { class: "legend" }, h("span", null, h("i", { style: "background:var(--bar-in)" }), "Collected"), h("span", null, h("i", { style: "background:var(--bar-out)" }), "Spent")),
      chart(d.months));
    root.appendChild(h("div", { class: "grid2" }, c, h("div", { class: "card" }, h("h2", { text: "How it was paid" }), rank(d.byMode, "amount", "mode", false))));
    root.appendChild(h("div", { class: "grid3" },
      h("div", { class: "card" }, h("h2", { text: "Top services by money received" }), rank(d.topServices, "amount", "service", false)),
      h("div", { class: "card" }, h("h2", { text: "Biggest expenses" }), rank(d.topExpenses, "amount", "head", true)),
      h("div", { class: "card" }, h("h2", { text: "Month by month" }), monthTable(d.months))
    ));
  }
  function monthTable(months) {
    var t = h("table"), tb = h("tbody");
    t.appendChild(h("thead", null, h("tr", null, h("th", { text: "Month" }), h("th", { class: "r", text: "New patients" }), h("th", { class: "r", text: "Visits" }))));
    months.forEach(function (m) { tb.appendChild(h("tr", null, h("td", { text: m.month }), h("td", { class: "r num", text: inr0.format(m.newPatients) }), h("td", { class: "r num", text: inr0.format(m.appointments) }))); });
    t.appendChild(tb); return h("div", { class: "tablewrap", style: "max-height:300px" }, t);
  }
  function loadDash() {
    fail(""); $("dash").setAttribute("aria-busy", "true");
    return api("/dashboard?" + periodQuery()).then(renderDash).catch(function (e) { if (e.message !== "signed out" && e.message !== "forbidden") fail(e.message); })
      .then(function () { $("dash").removeAttribute("aria-busy"); });
  }

  // ── reports ──
  function cellText(col, v) {
    if (v === null || v === undefined || v === "") return "";
    if (col.type === "money") return inr2.format(v);
    if (col.type === "int") return inr0.format(v);
    if (col.type === "date") { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v)); return m ? m[3] + "/" + m[2] + "/" + m[1] : String(v); }
    return String(v);
  }
  function renderMenu(cat) {
    var menu = $("menu"); menu.textContent = "";
    ["Money", "Patients", "Diary"].forEach(function (g) {
      menu.appendChild(h("h3", { text: g }));
      cat.reports.filter(function (r) { return r.group === g; }).forEach(function (r) {
        var b = h("button", { type: "button", text: r.title }); b.dataset.id = r.id;
        if (state.report === r.id) b.setAttribute("aria-current", "true");
        b.addEventListener("click", function () { openReport(r.id); });
        menu.appendChild(b);
      });
    });
  }
  function openReport(id) {
    state.report = id; renderMenu(state.catalog);
    var view = $("view"); view.textContent = ""; view.appendChild(h("div", { class: "empty", text: "Loading…" })); fail("");
    var q = periodQuery();
    api("/reports/" + encodeURIComponent(id) + "?" + q).then(function (r) {
      if (state.report !== id) return;
      view.textContent = "";
      view.appendChild(h("h2", { text: r.title }));
      view.appendChild(h("p", { class: "about", text: r.about + (r.allYears ? " Shows every year, whatever period is chosen above." : " Period: " + r.period.label + ".") }));
      view.appendChild(h("div", { class: "rowact" }, h("a", { class: "btn primary", href: API + "/reports/" + encodeURIComponent(id) + "/xlsx?" + q, text: "Download Excel" }),
        h("span", { class: "about", style: "margin:0", text: inr0.format(r.rows.length) + " row" + (r.rows.length === 1 ? "" : "s") })));
      if (r.truncated) view.appendChild(h("div", { class: "msg warn", text: "Only the first " + inr0.format(r.rows.length) + " rows are shown and exported. Choose a shorter period to see the rest." }));
      if (!r.rows.length) { view.appendChild(h("div", { class: "empty", text: "Nothing in this period." })); return; }
      var t = h("table"), head = h("tr");
      r.columns.forEach(function (c) { head.appendChild(h("th", { class: c.type === "money" || c.type === "int" ? "r" : "", text: c.label })); });
      t.appendChild(h("thead", null, head));
      var tb = h("tbody");
      r.rows.slice(0, 1000).forEach(function (row) {
        var tr = h("tr");
        r.columns.forEach(function (c) { var txt = cellText(c, row[c.key]); tr.appendChild(h("td", { class: c.type === "money" || c.type === "int" ? "r num" : "", title: txt, text: txt })); });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      if (r.totals) {
        var f = h("tr");
        r.columns.forEach(function (c, i) { var has = r.totals[c.key] !== undefined; f.appendChild(h("td", { class: has ? "r num" : "", text: i === 0 ? "Total" : has ? cellText(c, r.totals[c.key]) : "" })); });
        t.appendChild(h("tfoot", null, f));
      }
      view.appendChild(h("div", { class: "tablewrap" }, t));
      if (r.rows.length > 1000) view.appendChild(h("p", { class: "about", style: "margin-top:8px", text: "The screen shows the first 1,000 rows. The Excel file has all " + inr0.format(r.rows.length) + "." }));
    }).catch(function (e) { if (e.message !== "signed out" && e.message !== "forbidden") { view.textContent = ""; fail(e.message); } });
  }

  // ── wiring ──
  function setTab(tab) {
    state.tab = tab;
    $("tabDash").setAttribute("aria-selected", tab === "dash"); $("tabReports").setAttribute("aria-selected", tab === "reports");
    show($("dash"), tab === "dash"); show($("reports"), tab === "reports");
    refresh();
  }
  function refresh() {
    var q = periodQuery();
    $("dlAll").href = API + "/export/all?" + q;
    if (state.tab === "dash") loadDash();
    else if (state.catalog) { if (state.report) openReport(state.report); else renderMenu(state.catalog); }
  }
  $("tabDash").addEventListener("click", function () { setTab("dash"); });
  $("tabReports").addEventListener("click", function () { setTab("reports"); });
  $("apply").addEventListener("click", refresh);
  $("fy").addEventListener("change", function () { $("from").value = ""; $("to").value = ""; refresh(); });
  ["from", "to"].forEach(function (id) { $(id).addEventListener("change", function () { if ($("from").value || $("to").value) $("fy").value = ""; }); });

  function start() {
    fetch("/api/v1/auth/me", { credentials: "same-origin" }).then(function (r) {
      if (r.status === 401) { showSignin(); return null; }
      return r.json();
    }).then(function (me) {
      if (!me) return;
      show($("signin"), false); show($("app"), true); show($("who"), true);
      $("whoName").textContent = me.user.name + " (" + me.user.role + ")";
      if (me.user.role !== "admin") { show($("content"), false); show($("forbidden"), true); return; }
      show($("forbidden"), false); show($("content"), true);
      return Promise.all([api("/reports"), api("/dashboard")]).then(function (res) {
        state.catalog = res[0];
        var sel = $("fy"); sel.textContent = "";
        sel.appendChild(h("option", { value: "all", text: "All years" }));
        res[1].fys.forEach(function (y) { sel.appendChild(h("option", { value: y, text: "FY " + y })); });
        sel.value = res[1].period.label.replace("FY ", "");
        renderDash(res[1]); $("dlAll").href = API + "/export/all?" + periodQuery();
        renderMenu(state.catalog);
      });
    }).catch(function (e) { if (e && e.message !== "signed out" && e.message !== "forbidden") fail(e.message); });
  }
  start();
})();
</script>
</body>
</html>
