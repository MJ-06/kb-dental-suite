<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// When the clinic's own server serves this page, it sets KB_SCRIPT_URL_OVERRIDE to its own /exec.
const SCRIPT_URL = window.KB_SCRIPT_URL_OVERRIDE || "https://script.google.com/macros/s/AKfycby-OX-qvGE2U9Zt3b-_rpFqc5WQxRT5WMn1A030IcQIKXEaso36cMTbJ6c5xiP5O_6Zvg/exec";
function backendApi(action, data) {
  var p = new URLSearchParams(Object.assign({action:action}, data||{}));
  return fetch(SCRIPT_URL + "?" + p.toString()).then(function(r){ return r.json(); }).then(function(res){
    // The clinic's server answers only a signed-in device (done once, in the main app).
    if (res && res.authRequired) return { success:false, error:"Please ask the front desk to sign in on this device first, then try again." };
    return res;
  });
}

function ChatBotPage() {
  var e = React.createElement;
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useRef = React.useRef;

  /* ── Theme ── */
  var T = {
    primary:'#1A237E', primaryDk:'#0D1B6E', primaryLt:'#E8EAF6',
    green:'#1B5E20', greenMd:'#2E7D32', greenLt:'#E8F5E9',
    accent:'#FF6F00', white:'#fff',
    bg:'#F0F2F8', msgBg:'#fff', userBubble:'#1A237E',
    text:'#1A237E', subtext:'#546E7A', border:'#E3E8F0'
  };

  /* ── Storage ── */
  var STORE_KEY = 'kbdc_chatbot_sessions';
  function loadSessions(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); }catch(e2){ return []; } }
  function saveSessions(s){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(s)); }catch(e2){} }

  /* ── State ── */
  var ref0 = useState(function(){
    var s = loadSessions();
    return {
      sessions: s,
      activeId: s.length ? s[0].id : null,
      input: '',
      busy: false,
      sidebarOpen: true,
      lang: 'en',
      booking: null,  /* null | { step, name, phone, treatment, date, time } */
      manage: null,   /* null | { step, phone, appts, apptId, newDate, newDateISO } */
      treatmentsBlock: ''
    };
  });
  var st = ref0[0], setS = ref0[1];
  function upd(p){ setS(function(prev){ return Object.assign({},prev,typeof p==='function'?p(prev):p); }); }

  var bottomRef = useRef(null);
  var inputRef = useRef(null);

  /* ── Load real treatments list so the AI can ground its answers in what we actually offer ── */
  useEffect(function(){
    backendApi('getTreatmentsMaster').then(function(res){
      if(res && res.success && res.treatments && res.treatments.length){
        var byDept = {};
        res.treatments.forEach(function(t){
          var d = t.department || 'General';
          if(!byDept[d]) byDept[d] = [];
          byDept[d].push(t.name);
        });
        var block = Object.keys(byDept).map(function(d){ return d+': '+byDept[d].join(', '); }).join('\n');
        upd({ treatmentsBlock: block });
      }
    }).catch(function(){});
  }, []);

  /* ── Date parsing for booking/reschedule ("28 May", "28/05", "28/05/2026") ── */
  function parseToISODate(text){
    if(!text) return null;
    var t = text.trim();
    var d = null;
    if(/^\d{4}-\d{2}-\d{2}$/.test(t)){
      d = new Date(t+'T00:00:00');
    } else if(/^\d{1,2}\/\d{1,2}(\/\d{2,4})?$/.test(t)){
      var parts = t.split('/');
      var day = parseInt(parts[0],10), month = parseInt(parts[1],10)-1;
      var year = parts[2] ? (parts[2].length===2 ? 2000+parseInt(parts[2],10) : parseInt(parts[2],10)) : new Date().getFullYear();
      d = new Date(year, month, day);
    } else {
      var hasYear = /\d{4}/.test(t);
      d = new Date(hasYear ? t : t+' '+new Date().getFullYear());
    }
    if(!d || isNaN(d.getTime())) return null;
    var today = new Date(); today.setHours(0,0,0,0);
    if(d < today && !/\d{4}/.test(t)) d.setFullYear(d.getFullYear()+1);
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+dd;
  }
  function normTime(t){ return String(t||'').trim().toUpperCase().replace(/\s+/g,' '); }
  function timeToMinutes(s){
    var m = /(\d{1,2}):(\d{2})\s*([AP]M)/i.exec(String(s||''));
    if(!m) return null;
    var h = parseInt(m[1],10)%12; if(/pm/i.test(m[3])) h+=12;
    return h*60+parseInt(m[2],10);
  }
  function isTimeBlocked(t, from, to){
    if(!from || !to) return false;
    var tm = timeToMinutes(t), fm = timeToMinutes(from), tom = timeToMinutes(to);
    if(tm==null||fm==null||tom==null) return false;
    return tm>=fm && tm<tom;
  }
  /* ── Real slot availability — only ever offer genuinely open times ── */
  function fetchOpenSlots(isoDate){
    if(!isoDate) return Promise.resolve([]);
    return Promise.all([
      backendApi('getAppointments', {date:isoDate}),
      backendApi('getBlockedSlots', {date:isoDate})
    ]).then(function(results){
      var apptsRes = results[0], blocksRes = results[1];
      var taken = {};
      if(apptsRes && apptsRes.success){
        apptsRes.appointments.forEach(function(a){ if(a.status!=='Cancelled') taken[normTime(a.time)] = true; });
      }
      var blocks = (blocksRes && blocksRes.success) ? blocksRes.blocks : [];
      return TIME_SLOTS.filter(function(t){
        if(taken[normTime(t)]) return false;
        return !blocks.some(function(b){ return isTimeBlocked(t, b.fromTime, b.toTime); });
      });
    }).catch(function(){ return TIME_SLOTS.slice(); });
  }

  /* ── Active session ── */
  function getActive(state){
    var s = state || st;
    return s.sessions.find(function(x){ return x.id === s.activeId; }) || null;
  }
  function getActiveMsgs(){ var s = getActive(); return s ? s.msgs : []; }

  /* ── New session ── */
  function newSession(){
    var id = 'sess_' + Date.now();
    var sess = { id:id, title:'New Chat', createdAt:new Date().toISOString(), msgs:[] };
    upd(function(prev){
      var updated = [sess].concat(prev.sessions);
      saveSessions(updated);
      return { sessions:updated, activeId:id, input:'', busy:false, booking:null, manage:null };
    });
  }

  /* ── Switch session ── */
  function switchSession(id){
    upd({ activeId:id, input:'', busy:false, booking:null, manage:null });
  }

  /* ── Delete session ── */
  function deleteSession(id){
    upd(function(prev){
      var updated = prev.sessions.filter(function(s){ return s.id!==id; });
      saveSessions(updated);
      return { sessions:updated, activeId: updated.length ? updated[0].id : null };
    });
  }

  /* ── Add message to active session ── */
  function addMsg(msg, bookingPatch){
    upd(function(prev){
      var sessions = prev.sessions.map(function(sess){
        if(sess.id !== prev.activeId) return sess;
        var msgs = sess.msgs.concat([msg]);
        var title = sess.title==='New Chat' && msg.role==='user'
          ? msg.text.slice(0,38) + (msg.text.length>38?'…':'')
          : sess.title;
        return Object.assign({},sess,{msgs:msgs,title:title});
      });
      saveSessions(sessions);
      var patch = { sessions:sessions };
      if(bookingPatch !== undefined) patch.booking = bookingPatch;
      return patch;
    });
  }

  function updateTypingMsg(typingId, newMsg){
    upd(function(prev){
      var sessions = prev.sessions.map(function(sess){
        if(sess.id !== prev.activeId) return sess;
        var msgs = sess.msgs.filter(function(m){ return m.id!==typingId; }).concat([newMsg]);
        return Object.assign({},sess,{msgs:msgs});
      });
      saveSessions(sessions);
      return { sessions:sessions, busy:false };
    });
  }

  /* ── Scroll ── */
  function scrollBottom(){
    setTimeout(function(){
      if(bottomRef.current) bottomRef.current.scrollIntoView({behavior:'smooth'});
    }, 80);
  }

  /* ── Language detection ── */
  function detectLang(text){
    var t = text.toLowerCase();
    var hindiChars = /[\u0900-\u097F]/.test(text);
    if(hindiChars) return 'hi';
    var hinglishWords = ['kya','hai','hain','nahi','kaise','kab','kahan','batao','chahiye','please','thik','theek','accha','acha','bilkul','zaroor','bata','mujhe','mera','meri','aap','hum','tum','dard','dant','pet','sir','bhai','behen','ji','haa','haan','nhi','abhi','jaldi','zyada','bahut','phir','kyun','kaun','kitna'];
    var words = t.split(/\s+/);
    var hinglishCount = words.filter(function(w){ return hinglishWords.indexOf(w)>=0; }).length;
    return hinglishCount >= 1 ? 'hg' : 'en';
  }

  /* ── Comprehensive Knowledge Base ── */
  var KB = {

      next.step = 'date';

      next.date = text.trim();
      next.step = 'time';
    } else if(step==='time'){
      next.time = text.trim();
      next.step = 'confirm';

      if(t.indexOf('yes')>=0||t.indexOf('confirm')>=0||t.indexOf('ok')>=0||t.indexOf('han')>=0||t.indexOf('haa')>=0||t.indexOf('bilkul')>=0||t.indexOf('sahi')>=0){

              nextPrompt2 = lang==='hi' ? '\u092E\u093E\u092B\u093C \u0915\u0940\u091C\u093F\u090F, \u0907\u0938 \u0924\u093E\u0930\u0940\u0916 \u0915\u094B \u0915\u094B\u0908 \u0938\u094D\u0932\u0949\u091F \u0909\u092A\u0932\u092C\u094D\u0927 \u0928\u0939\u0940\u0902\u0964 \u0915\u094B\u0908 \u0914\u0930 \u0924\u093E\u0930\u0940\u0916 \u092C\u0924\u093E\u090F\u0902?' : lang==='hg' ? 'Sorry, is date par koi slot available nahi hai. Koi aur date batayein?' : 'Sorry, there are no open slots on that date. Could you suggest another date?';
              chips2 = [];
              storeBooking2 = Object.assign({}, nextBooking, {step:'date'});
            }
            var nextBotMsg2 = { id:'b'+Date.now(), role:'bot', text:nextPrompt2, bookingChips:chips2, confirmBtns:[] };
            upd(function(prev){
              var sessions = prev.sessions.map(function(sess){
                if(sess.id!==prev.activeId) return sess;
                return Object.assign({},sess,{msgs:sess.msgs.concat([nextBotMsg2])});
              });
              saveSessions(sessions);
              return { sessions:sessions, booking:storeBooking2 };
            });
            scrollBottom();
          });
          return;
        }

        var nextPrompt = bookingPrompt(nextBooking.step, nextBooking, lang);
        var extraBtns = [];
        if(nextBooking.step==='confirm'){
          extraBtns = [{icon:'\u2705',label:'Yes, Confirm',action:'confirm'},{icon:'\u274C',label:'Cancel',action:'cancel'}];
        }
        upd(function(prev){
          var nextBotMsg = { id:'b'+Date.now(), role:'bot', text:nextPrompt, bookingChips: nextBooking.step==='treatment' ? TREATMENTS : [], confirmBtns:extraBtns };
          var sessions = prev.sessions.map(function(sess){
            if(sess.id!==prev.activeId) return sess;
            return Object.assign({},sess,{msgs:sess.msgs.concat([nextBotMsg])});
          });
          saveSessions(sessions);
          return { sessions:sessions, booking:nextBooking };
        });
        scrollBottom();
      }
      return;
    }

    // Check if in manage-existing-appointment flow (reschedule/cancel)
    var mgr = st.manage;
    if(mgr && mgr.step){
      upd(function(prev){
        var sessions = prev.sessions.map(function(sess){
          if(sess.id!==prev.activeId) return sess;
          var t3b = sess.title==='New Chat' ? text.slice(0,38)+(text.length>38?'\u2026':'') : sess.title;
          return Object.assign({},sess,{msgs:sess.msgs.concat([uMsg]),title:t3b});
        });
        saveSessions(sessions);
        return { sessions:sessions };
      });

      var pushBotMsg = function(msg, patch){
        upd(function(prev){
          var sessions = prev.sessions.map(function(sess){
            if(sess.id!==prev.activeId) return sess;
            return Object.assign({},sess,{msgs:sess.msgs.concat([msg])});
          });
          saveSessions(sessions);
          return Object.assign({ sessions:sessions }, patch||{});
        });
        scrollBottom();
      };

      if(mgr.step==='phone'){
        backendApi('findAppointmentsByPhone', {phone:text.trim()}).then(function(res){
          var appts = (res && res.success) ? res.appointments : [];
          if(!appts.length){
            pushBotMsg({ id:'b'+Date.now(), role:'bot',
              text: lang==='hi' ? '\u092E\u093E\u092B\u093C \u0915\u0940\u091C\u093F\u090F, \u0907\u0938 \u0928\u0902\u092C\u0930 \u092A\u0930 \u0915\u094B\u0908 \u0905\u092A\u0949\u0907\u0902\u091F\u092E\u0947\u0902\u091F \u0928\u0939\u0940\u0902 \u092E\u093F\u0932\u093E\u0964 \u0915\u0943\u092A\u092F\u093E \u0915\u094D\u0932\u093F\u0928\u093F\u0915 \u0915\u094B \u0915\u0949\u0932 \u0915\u0930\u0947\u0902\u0964' : lang==='hg' ? 'Sorry, is number par koi appointment nahi mila. Clinic ko call kar lijiye.' : 'Sorry, I could not find any upcoming appointment with that number. Please call the clinic and our team will help.',
              buttons:[{icon:'\uD83D\uDCDE',label:'Call Us',href:'tel:9319990912'}]
            }, { manage:null });
            return;
          }
          var listText = appts.map(function(a,i){ return (i+1)+'. '+a.date+' at '+a.time+' \u2014 '+a.type+' ('+a.status+')'; }).join('\n');
          var promptTxt = (lang==='hi'?'\u0906\u092A\u0915\u0947 \u0905\u092A\u0949\u0907\u0902\u091F\u092E\u0947\u0902\u091F:\n':lang==='hg'?'Aapke appointments:\n':'Here are your upcoming appointments:\n') + listText + '\n\n' + (lang==='hi'?'\u0915\u0943\u092A\u092F\u093E \u0928\u0902\u092C\u0930 \u092C\u0924\u093E\u090F\u0902 (\u091C\u0948\u0938\u0947 1)':lang==='hg'?'Number batayein (jaise 1)':'Please tell me the number (e.g. 1)');
          var chips = appts.map(function(a,i){ return String(i+1); });
          pushBotMsg({ id:'b'+Date.now(), role:'bot', text:promptTxt, bookingChips:chips },
            { manage: Object.assign({}, mgr, {step:'selectAppt', appts:appts}) });
        });
        return;
      }

      if(mgr.step==='selectAppt'){
        var idx = parseInt(text.trim(),10) - 1;
        var chosen = mgr.appts[idx];
        if(!chosen){
          pushBotMsg({ id:'b'+Date.now(), role:'bot', text: lang==='hi'?'\u0915\u0943\u092A\u092F\u093E \u0938\u0942\u091A\u0940 \u092E\u0947\u0902 \u0938\u0947 \u0938\u0939\u0940 \u0928\u0902\u092C\u0930 \u092C\u0924\u093E\u090F\u0902\u0964':lang==='hg'?'List me se sahi number batayein.':'Please pick a valid number from the list above.' });
          return;
        }
        var actionPrompt = lang==='hi'?'\u0915\u094D\u092F\u093E \u0906\u092A \u0907\u0938\u0947 \u0930\u0940\u0936\u0947\u0921\u094D\u092F\u0942\u0932 \u0915\u0930\u0928\u093E \u091A\u093E\u0939\u0924\u0947 \u0939\u0948\u0902 \u092F\u093E \u0915\u0948\u0902\u0938\u093F\u0932?':lang==='hg'?'Reschedule karna hai ya cancel?':'Would you like to reschedule or cancel this appointment?';
        pushBotMsg({ id:'b'+Date.now(), role:'bot', text:actionPrompt, bookingChips:['Reschedule','Cancel'] },
          { manage: Object.assign({}, mgr, {step:'action', apptId:chosen.id}) });
        return;
      }

      if(mgr.step==='action'){
        var lc = text.toLowerCase();
        if(/cancel/.test(lc)){
          backendApi('updateAppointmentStatus', {apptId:mgr.apptId, status:'Cancelled', cancelReason:'Cancelled via chatbot'}).then(function(){
            pushBotMsg({ id:'b'+Date.now(), role:'bot', text: lang==='hi'?'\u0906\u092A\u0915\u093E \u0905\u092A\u0949\u0907\u0902\u091F\u092E\u0947\u0902\u091F \u0915\u0948\u0902\u0938\u093F\u0932 \u0915\u0930 \u0926\u093F\u092F\u093E \u0917\u092F\u093E \u0939\u0948\u0964':lang==='hg'?'Aapka appointment cancel kar diya gaya hai.':'Your appointment has been cancelled. Hope to see you another time!' }, { manage:null });
          });
          return;
        }
        if(/resched/.test(lc)){
          pushBotMsg({ id:'b'+Date.now(), role:'bot', text: bookingPrompt('date', {}, lang) },
            { manage: Object.assign({}, mgr, {step:'newDate'}) });
          return;
        }
        pushBotMsg({ id:'b'+Date.now(), role:'bot', text: lang==='hi'?'\u0930\u0940\u0936\u0947\u0921\u094D\u092F\u0942\u0932 \u092F\u093E \u0915\u0948\u0902\u0938\u093F\u0932?':lang==='hg'?'Reschedule ya cancel?':'Reschedule or Cancel?', bookingChips:['Reschedule','Cancel'] });
        return;
      }

      if(mgr.step==='newDate'){
        var isoD = parseToISODate(text.trim());
        fetchOpenSlots(isoD).then(function(openSlots){
          if(!isoD || !openSlots.length){
            pushBotMsg({ id:'b'+Date.now(), role:'bot', text: lang==='hi'?'\u092E\u093E\u092B\u093C \u0915\u0940\u091C\u093F\u090F, \u0907\u0938 \u0924\u093E\u0930\u0940\u0916 \u0915\u094B \u0938\u094D\u0932\u0949\u091F \u0928\u0939\u0940\u0902\u0964 \u0915\u094B\u0908 \u0914\u0930 \u0924\u093E\u0930\u0940\u0916 \u092C\u0924\u093E\u090F\u0902\u0964':lang==='hg'?'Sorry, us date par slot nahi hai. Doosri date batayein.':'Sorry, no open slots that day \u2014 please try another date.' });
            return;
          }
          pushBotMsg({ id:'b'+Date.now(), role:'bot', text: bookingPrompt('time', {}, lang), bookingChips:openSlots },
            { manage: Object.assign({}, mgr, {step:'newTime', newDate:text.trim(), newDateISO:isoD}) });
        });
        return;
      }

      if(mgr.step==='newTime'){
        backendApi('updateAppointment', {apptId:mgr.apptId, date:mgr.newDateISO, time:text.trim()}).then(function(){
          pushBotMsg({ id:'b'+Date.now(), role:'bot', text: lang==='hi'?'\u0906\u092A\u0915\u093E \u0905\u092A\u0949\u0907\u0902\u091F\u092E\u0947\u0902\u091F \u0928\u0908 \u0924\u093E\u0930\u0940\u0916/\u0938\u092E\u092F \u092A\u0930 \u092C\u0926\u0932 \u0926\u093F\u092F\u093E \u0917\u092F\u093E \u0939\u0948\u0964':lang==='hg'?'Aapka appointment naye date/time par reschedule ho gaya hai.':'Your appointment has been rescheduled successfully!' }, { manage:null });
        });
        return;
      }
      return;
    }

    // Check if message is about managing an EXISTING appointment (checked before
    // the new-booking intent, since "reschedule" contains the substring "schedule")
    var isManageRequest = /cancel|resched|postpone|badal.*appoint|change.*appoint/i.test(text.toLowerCase());
    if(isManageRequest){
      var initManage = { step:'phone', appts:[], apptId:null };
      var initPromptM = lang==='hi' ? '\u091C\u093C\u0930\u0942\u0930! \u0915\u0943\u092A\u092F\u093E \u0935\u0939 \u092E\u094B\u092C\u093E\u0907\u0932 \u0928\u0902\u092C\u0930 \u092C\u0924\u093E\u090F\u0902 \u091C\u093F\u0938\u0938\u0947 \u0905\u092A\u0949\u0907\u0902\u091F\u092E\u0947\u0902\u091F \u092C\u0941\u0915 \u0939\u0941\u0906 \u0925\u093E\u0964' : lang==='hg' ? 'Bilkul! Jis number se booking hui thi, wo mobile number batayein.' : 'Sure! Please share the mobile number your appointment was booked with.';
      var initBotMsgM = { id:'b'+Date.now(), role:'bot', text:initPromptM };
      upd(function(prev){
        var sessions = prev.sessions.map(function(sess){
          if(sess.id!==prev.activeId) return sess;
          var t2m = sess.title==='New Chat' ? text.slice(0,38)+(text.length>38?'\u2026':'') : sess.title;
          return Object.assign({},sess,{msgs:sess.msgs.concat([uMsg,initBotMsgM]),title:t2m});
        });
        saveSessions(sessions);
        return { sessions:sessions, manage:initManage };
      });
      scrollBottom();
      return;
    }

    // Check if message is appointment-related
    var isBookingRequest = /book|appoint|visit|aana|aaye|chahiye.*appointment|schedule|slot|fix appointment|book karo|appointment chahiye/.test(text.toLowerCase());
    if(isBookingRequest){
      var initBooking = { step:'name', name:'', phone:'', treatment:'', date:'', time:'' };
      var initPrompt = bookingPrompt('name', initBooking, lang);
      var initBotMsg2 = { id:'b'+Date.now(), role:'bot', text:initPrompt };
      upd(function(prev){
        var sessions = prev.sessions.map(function(sess){
          if(sess.id!==prev.activeId) return sess;
          var t2 = sess.title==='New Chat' ? text.slice(0,38)+(text.length>38?'…':'') : sess.title;
          return Object.assign({},sess,{msgs:sess.msgs.concat([uMsg,initBotMsg2]),title:t2});
        });
        saveSessions(sessions);
        return { sessions:sessions, booking:initBooking };
      });
      scrollBottom();
      return;
    }

    // Normal chat — build apiMsgs BEFORE state update to avoid stale closure
    var currentMsgs7 = getActiveMsgs();
    var apiMsgs = currentMsgs7
      .filter(function(m){ return (m.role==='user'||m.role==='bot') && !m.typing; })
      .map(function(m){ return {role:m.role==='user'?'user':'assistant', content:m.text}; })
      .concat([{role:'user', content:text}]);

    upd(function(prev){
      var sessions = prev.sessions.map(function(sess){
        if(sess.id!==prev.activeId) return sess;
        var t7 = sess.title==='New Chat' ? text.slice(0,38)+(text.length>38?'…':'') : sess.title;
        return Object.assign({},sess,{msgs:sess.msgs.concat([uMsg,{id:tId,role:'bot',text:'',typing:true}]),title:t7});
      });
      saveSessions(sessions);
      return { sessions:sessions, busy:true, input:'' };
    });
    scrollBottom();

    backendApi('chatbotReply', { system:SYSTEM, messages:JSON.stringify(apiMsgs) })
    .then(function(data){
      var reply = data && data.success && data.reply ? data.reply : localFallback(text,lang);
      var btns = getActionBtns(reply+' '+text, lang);
      var botMsg = {id:'b'+Date.now(),role:'bot',text:reply,buttons:btns,lang:lang};
      updateTypingMsg(tId, botMsg);
      scrollBottom();
    })
    .catch(function(){
      var reply = localFallback(text,lang);
      var btns = getActionBtns(reply+' '+text, lang);
      updateTypingMsg(tId,{id:'b'+Date.now(),role:'bot',text:reply,buttons:btns,lang:lang});
      scrollBottom();
    });
  }

  /* ── Action buttons based on content ── */
  function getActionBtns(text, lang){
    var t = (text||'').toLowerCase();
    var btns = [];
    if(/location|address|direction|kahan|reach|metro|map/.test(t))
      btns.push({icon:'\uD83D\uDCCD',label:'Get Directions',href:'https://maps.google.com/?q=Block+R-74+B,+Dilshad+Garden,+Delhi'});
    if(/book|appoint|visit|schedule|slot/.test(t))
      btns.push({icon:'\uD83D\uDCC5',label:'Book Appointment',action:'book'});
    if(/emergency|urgent|pain|swelling|dard|tez|severe/.test(t))
      btns.push({icon:'\uD83D\uDCDE',label:'Call Now — Emergency',href:'tel:9319990912'});
    if(btns.length===0)
      btns.push({icon:'\uD83D\uDCC5',label:'Book Appointment',action:'book'});
    btns.push({icon:'\uD83D\uDCAC',label:'WhatsApp Us',href:'https://wa.me/919319990912?text='+encodeURIComponent('Hello K.B. Dental Clinic, I need help with dental care.')});
    return btns;
  }

  function handleBtnAction(btn){
    if(btn.action==='book'){
      send('I want to book an appointment');
    } else if(btn.action==='confirm'){
      send('Yes, confirm');
    } else if(btn.action==='cancel'){
      send('No, cancel');
    } else if(btn.href){
      window.open(btn.href,'_blank');
    }
  }

            return e('button',{key:bi,onClick:function(){handleBtnAction(btn);},style:{
              display:'inline-flex',alignItems:'center',gap:5,
              padding:'7px 14px',borderRadius:20,
              background: btn.href&&btn.href.indexOf('wa.me')>=0?'#25D366':'#fff',
              border:'1.5px solid '+(btn.href&&btn.href.indexOf('wa.me')>=0?'#25D366':'#1A237E'),

          '+ New Chat'
        )

        st.sessions.length===0

          : st.sessions.map(function(sess){
            var isActive = sess.id===st.activeId;
            return e('div',{key:sess.id,style:{
              padding:'10px 12px',borderRadius:10,marginBottom:4,cursor:'pointer',
              background:isActive?'#EEF2FF':'transparent',

              transition:'all .15s'
            }},
              e('div',{style:{display:'flex',alignItems:'flex-start',gap:6}},
                e('div',{style:{flex:1},onClick:function(){switchSession(sess.id);}},
                  e('div',{style:{fontSize:12,fontWeight:600,color:isActive?'#1A237E':'#374151',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:2}},sess.title),
                  e('div',{style:{fontSize:10,color:'#9CA3AF'}},new Date(sess.createdAt).toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' \u00b7 '+sess.msgs.length+' msgs')
                ),
                e('button',{onClick:function(ev){ev.stopPropagation();deleteSession(sess.id);},style:{padding:'2px 6px',background:'transparent',border:'none',color:'#EF5350',cursor:'pointer',fontSize:13,borderRadius:4,flexShrink:0}},'\u00D7')
              )
            );
          })
      )
    ),

    /* ── Main chat area ── */
    e('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}},

      /* Chat header */
      e('div',{style:{background:'linear-gradient(135deg,#1A237E,#1357A6)',padding:'12px 16px',flexShrink:0,boxShadow:'0 2px 8px rgba(0,0,0,.15)'}},
        e('div',{style:{display:'flex',alignItems:'center',gap:12}},
          e('button',{onClick:function(){upd(function(p){return {sidebarOpen:!p.sidebarOpen};});},style:{background:'rgba(255,255,255,.15)',border:'none',color:'#fff',padding:'6px 10px',borderRadius:8,cursor:'pointer',fontSize:14}},
            st.sidebarOpen?'\u25C0':'\u25B6'
          ),
          e('div',{style:{width:38,height:38,borderRadius:'50%',background:'rgba(255,255,255,.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,border:'2px solid rgba(255,255,255,.4)'}},'🦷'),
          e('div',{style:{flex:1}},
            e('div',{style:{fontSize:14,fontWeight:700,color:'#fff'}}, 'KB Dental Assistant'),
            e('div',{style:{fontSize:10.5,color:'rgba(255,255,255,.7)'}}, 'K.B. Dental Clinic, Dilshad Garden \u00b7 Online 24x7')
          ),
          e('div',{style:{display:'flex',alignItems:'center',gap:6}},
            e('a',{href:'tel:9319990912',style:{background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.4)',color:'#fff',padding:'5px 12px',borderRadius:20,fontSize:11,fontWeight:600,textDecoration:'none',display:'flex',alignItems:'center',gap:4}},'\uD83D\uDCDE Call'),
            e('a',{href:'https://wa.me/919319990912',target:'_blank',style:{background:'#25D366',border:'none',color:'#fff',padding:'5px 12px',borderRadius:20,fontSize:11,fontWeight:600,textDecoration:'none',display:'flex',alignItems:'center',gap:4}},'\uD83D\uDCAC WhatsApp')
          )
        )
      ),

      /* Messages */
      e('div',{style:{flex:1,overflowY:'auto',padding:'12px 16px 6px'}},
        activeMsgs.length===0 ? renderWelcome() : activeMsgs.map(function(msg,i){ return renderMsg(msg,i); }),
        e('div',{ref:bottomRef,style:{height:1}})
      ),

      /* Quick chips */
      chips.length>0 && e('div',{style:{padding:'8px 16px 0',background:'#fff',borderTop:'1px solid '+T.border,display:'flex',gap:6,overflowX:'auto',flexShrink:0}},
        chips.slice(0,5).map(function(chip,ci){
          return e('button',{key:ci,onClick:function(){send(chip.en);},style:{
            padding:'6px 14px',borderRadius:20,border:'1.5px solid #C5CAE9',
            background:'#EEF2FF',color:'#1A237E',fontSize:11.5,fontWeight:500,
            cursor:'pointer',fontFamily:"'Poppins',sans-serif",whiteSpace:'nowrap',flexShrink:0
          }},chip.label);
        })
      ),

      /* Input bar */
      e('div',{style:{background:'#fff',padding:'10px 16px 14px',flexShrink:0,borderTop:'1px solid '+T.border,boxShadow:'0 -2px 8px rgba(0,0,0,.05)'}},
        e('div',{style:{display:'flex',gap:8,alignItems:'center'}},
          e('input',{
            value:st.input,
            onChange:function(ev){upd({input:ev.target.value});},
            onKeyDown:function(ev){ if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();send();} },
            placeholder:st.lang==='hi'?'\u0905\u092A\u0928\u093E \u0938\u0935\u093E\u0932 \u0932\u093F\u0916\u0947\u0902...':st.lang==='hg'?'Apna sawaal likhein...':'Type your question here...',
            disabled:st.busy,
            style:{
              flex:1,padding:'12px 18px',
              border:'1.5px solid '+(st.busy?'#C5CAE9':'#9FA8DA'),
              borderRadius:28,fontSize:13,outline:'none',
              fontFamily:"'Poppins',sans-serif",
              background:st.busy?'#F8F9FE':'#fff',
              color:'#1A237E',transition:'border-color .2s',
              boxShadow:'inset 0 1px 4px rgba(0,0,0,.04)'
            }
          }),
          e('button',{
            onClick:function(){send();},
            disabled:st.busy||!st.input.trim(),
            style:{
              width:46,height:46,borderRadius:'50%',
              background:st.busy||!st.input.trim()?'#C5CAE9':'linear-gradient(135deg,#1A237E,#1357A6)',
              border:'none',color:'#fff',fontSize:18,
              cursor:st.busy||!st.input.trim()?'not-allowed':'pointer',
              display:'flex',alignItems:'center',justifyContent:'center',
              flexShrink:0,boxShadow:st.busy||!st.input.trim()?'none':'0 3px 10px rgba(26,35,126,.4)',
              transition:'all .2s'
            }
          }, st.busy ? '\u2026' : '\u27A4')
        )
      )
    )
  );
}



const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(ChatBotPage, null));
</script>
</body>
</html>
